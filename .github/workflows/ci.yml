name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-smoke:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (critical errors only)
        run: ruff check --select E9,F63,F7,F82 scripts/ vps/ unified_server.py

      - name: Compile all Python modules
        run: python -m compileall -q scripts/ vps/ web/ unified_server.py

      - name: Smoke import of web console
        run: python -c "import unified_server; print('unified_server OK')"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
